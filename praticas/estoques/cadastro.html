<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=storefront" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu,storefront" />
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
</head>

<body>
    <header>
        <span class="material-symbols-outlined" id="store">
            storefront
        </span>
        <div id="empresa"></div>
        <span class="material-symbols-outlined" id="menu">
            menu
        </span>
    </header>
    <nav id="hamburguer">
        <a href="produtos.html">produtos</a>
        <a href="login.html">Login</a>
    </nav>
    <main>
        <section>
            <label for="nomepro">Nome:</label>
            <div class="login"><input type="text" name="nomepro" id="nomepro" placeholder="Nome do produto"
                    autocomplete="off"></div>
            <label for="valorpro">Preço:</label>
            <div class="login"><input type="number" name="valorpro" id="valorpro" placeholder="Preço do produto em R$">
            </div>
            <label for="quantidadepro">Quantidade:</label>
            <div class="login"> <input type="number" name="quantidade" id="quantidadepro"
                    placeholder="quantidade do produto"></div>
            <input type="button" value="Cadastrar" id="submit">
        </section>
    </main>
    <script src="cadastro.js"></script>
</body>

</html>
