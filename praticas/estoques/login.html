<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=login" />
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
</head>

<body>
    <header>
        <h1>Login <span class="material-symbols-outlined">
                login
            </span></h1>
    </header>
    <main>

        <section>
            <div>
                <label for="user">Empresa:</label>
                <input type="text" name="User" id="user" placeholder="Nome da sua empresa" autocomplete="off">
            </div>
            <input type="submit" value="Enviar" id="submit">
        </section>
    </main>
    <script>
        let user = document.querySelector('#user')
        let submit = document.querySelector('#submit')

        submit.addEventListener("click", login)
        function login() {
            if (user.value === "") {
                alert('Verifique Novamente')
            } else {
                localStorage.setItem("login", user.value)
                alert('Login Efetuado')
                window.location.href = "cadastro.html"
            }
        }
    </script>
</body>

</html>
