<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contador</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            flex-flow: column wrap;
            background-color: rgb(61, 168, 255);
        }

        h1 {
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.349);
        }

        section {
            text-align: center;
            display: flex;
            align-items: center;
            flex-flow: column wrap;
            padding: 10px;
            background-color: white;
            box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.409);
            border-radius: 10px;
        }

        #inicio,
        #salto,
        #fim {
            width: 50%;
        }

        #enviar,
        #limpar {
            width: 90%;
            margin-top: 5px;
        }

        footer {
            margin-top: 10px;
            color: white;
            background-color: rgb(0, 107, 161);
            padding: 6px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1>CONTADOR</h1>
    </header>
    <section>
        <label for="inicio">inicio</label>
        <input type="number" name="inicio" id="inicio">
        <label for="salto">salto</label>
        <input type="number" name="salto" id="salto">
        <label for="fim">fim</label>
        <input type="number" name="fim" id="fim">
        <input type="button" value="Enviar" id="enviar">
        <input type="button" value="limpar" id="limpar">
        <div id="res"></div>
    </section>
    <footer>
        <p>feito pelo artxdev</p>
    </footer>

    <script>
        var start = document.querySelector('#inicio')
        var jump = document.querySelector('#salto')
        var end = document.querySelector('#fim')
        var submit = document.querySelector('#enviar')
        var reset = document.querySelector('#limpar')
        var res = document.querySelector('#res')

        submit.addEventListener("click", contador)
        function contador() {
            if (Number(start.value) == 0 || Number(end.value) == 0) {
                alert('⚠ preencha os campos')
            }

            else
                if (Number(jump.value) == 0) {
                    alert('❗ salto foi considerado 1 ❗')
                    let s = Number(jump.value)
                    s = 1
                    for (var c = Number(start.value); c <= Number(end.value); c += s) {
                        res.innerHTML += `${c} 👉`
                    }
                    res.innerHTML += '🏁'
                }

                else {
                    for (var c = Number(start.value); c <= Number(end.value); c += Number(jump.value)) {
                        res.innerHTML += `${c} 👉`
                    }
                    res.innerHTML += '🏁'
                }


        }

        reset.addEventListener("click", clear)
        function clear() {
            start.value = ''
            end.value = ''
            jump.value = ''
            res.innerHTML = ''
        }

    </script>
</body>

</html>
