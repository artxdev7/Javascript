<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabuada</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            flex-flow: column wrap;
            background-color: rgb(61, 168, 255);
        }

        h1 {
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.349);
        }

        section {
            text-align: center;
            display: flex;
            align-items: center;
            flex-flow: column wrap;
            padding: 10px;
            background-color: white;
            box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.409);
            border-radius: 10px;
        }

        #inicio,
        #salto,
        #fim {
            width: 50%;
        }

        #enviar,
        #limpar {
            width: 50%;
            margin-top: 5px;
        }

        footer {
            margin-top: 10px;
            color: white;
            background-color: rgb(0, 107, 161);
            padding: 6px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1>TABUADA</h1>
    </header>
    <section>
        <label for="n1txt">Numero</label>
        <input type="number" name="n1txt" id="n1txt" placeholder="esolha um numero">
        <input type="submit" value="Enviar" id="enviar">
        <select name="res" id="res" size="10">

        </select>
    </section>
    <footer>
        <p>feito pelo artxdev</p>
    </footer>
    <script>
        var submit = document.querySelector('#enviar')
        var n1txt = document.querySelector('#n1txt')
        var res = document.querySelector('#res')

        submit.addEventListener("click", tabuada)
        function tabuada() {
            // Corrige para n1txt e corrige 'leght' para 'length'
            if (n1txt.value.length == 0) {
                alert('⚠️ Insira um numero')
            } else {
                let n1 = Number(n1txt.value)
                let c = 0

                // Limpa o resultado anterior antes de gerar uma nova tabuada (boa prática)
                res.innerHTML = ''

                while (c <= 10) {
                    let item = document.createElement('option')
                    item.text = `${n1} x ${c} = ${n1 * c}`
                    res.appendChild(item)
                    c++
                }
            }
        }
    </script>
</body>

</html>
