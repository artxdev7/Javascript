<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>condições</title>
</head>

<body>
    <h1>sistemas de multa</h1>
    velocidade do carro:<input type="number" name="" id="txtvel">km/h <br>
    <input type="button" value="verificar" onclick="calcular()">
    <div id="res"></div>

    <script>
        function calcular() {
            var txtv = document.querySelector('#txtvel')
            var res = document.querySelector('#res')
            var vel = Number(txtv.value)
            res.innerHTML = `<p>sua velocida foi de <strong>${vel} km/h</strong></p>`
            if (vel > 60) {
                res.innerHTML += 'voce esta <strong>MUTADO</strong> por exessco de velocidade'
            }
            res.innerHTML += `<p>dirija sempre com sinto ded segurança!</p>`
        }
    </script>
</body>

</html>
