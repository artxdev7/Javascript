<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>somando</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        input {
            width: 100px;
        }

        #res {
            margin-top: 20px;
            background-color: rgba(255, 0, 0, 0.107);
            border-radius: 5px;
            width: 200px;
        }
    </style>
</head>

<body>
    <h1>somando</h1>
    <input type="number" name="n1" id="txt1"> +
    <input type="number" name="n2" id="txt2">
    <input type="button" value="somar" onclick="somar()">
    <div id="res">Resultado: </div>
    <script>
        function somar() {
            var tn1 = document.getElementById('txt1')
            var tn2 = document.getElementById('txt2')
            var res = document.querySelector('#res')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var s = n1 + n2
            res.innerHTML = `a soma entre ${n1} e ${n2} é <strong>${s}</strong>`
        }
    </script>
</body>

</html>
